    let votosLutadores = {
        lutadores: [],
        votos: []
    };

    let votosMusicas = {
        musicas: [],

    };

    let lutadoresCarregados = false;
    let musicasCarregadas = false;

    function verificarCarregamento() {

        if (lutadoresCarregados == true && musicasCarregadas == true) {
            criarGraficos();
        }
    }


    function obtervotos() {

        fetch("/enquete/votos/1")
            .then(function (resposta) {
                return resposta.json();
            })
            .then(function (dados) {
                console.log(dados);
                for (let i = 0; i < dados.length; i++) {
                    votosLutadores.lutadores.push(dados[i].descricao);
                    votosLutadores.votos.push(dados[i].quantidade_votos);
                }
                console.log(votosLutadores);
                lutadoresCarregados = true;
                verificarCarregamento()
            })
            .catch(function (erro) {
                console.log("Erro ao buscar votos:", erro);
            });



        fetch("/enquete/votos/2")
            .then(function (resposta) {
                return resposta.json();
            })
            .then(function (dados) {
                console.log(dados);

                for (let i = 0; i < dados.length; i++) {
                    votosMusicas.musicas.push(dados[i].descricao);
                    votosMusicas.votos.push(dados[i].quantidade_votos);
                }
                console.log(votosMusicas);
                musicasCarregadas = true;
                verificarCarregamento();
            })
            .catch(function (erro) {
                console.log("Erro ao buscar votos:", erro);
            });
    }




    // Criando estrutura para plotar gráfico - config

    function criarGraficos() {


        // kpi 3
        let totalVotos = 0;
        for (let i = 0; i < votosLutadores.votos.length; i++) {
            totalVotos += votosLutadores.votos[i];
        }

        for (let i = 0; i < votosMusicas.votos.length; i++) {
            totalVotos += votosMusicas.votos[i];
        }

        total_votos.innerHTML = `${totalVotos}`;

        //kpi 1
        let maiorVoto = 0;
        let maisVotado = "";
        let total_votos_lutadores = 0;

        for (let i = 0; i < votosLutadores.votos.length; i++) {
            if (votosLutadores.votos[i] > maiorVoto) {
                maiorVoto = votosLutadores.votos[i]
                maisVotado = votosLutadores.lutadores[i]
            }
            total_votos_lutadores += votosLutadores.votos[i]
        }
        let percent_votos = (maiorVoto / total_votos_lutadores) * 100;

        mais_votado.innerHTML = `${maisVotado}`
        percent_lutador.innerHTML = `${percent_votos.toFixed(1)}% dos votos`

        // kpi 2
        let maiorVoto_musica = 0;
        let maisVotada = "";
        let total_votos_musica = 0;

        for (let i = 0; i < votosMusicas.votos.length; i++) {
            if (votosMusicas.votos[i] > maiorVoto_musica) {
                maiorVoto_musica = votosMusicas.votos[i]
                maisVotada = votosMusicas.musicas[i]
            }
            total_votos_musica += votosMusicas.votos[i]
        }
        let percent_musica = (maiorVoto_musica / total_votos_musica) * 100;

        mais_votada.innerHTML = `${maisVotada}`
        percentual_musica.innerHTML = `${percent_musica.toFixed(1)}% dos votos`



        // Adicionando gráfico criado em div na tela
        const votos_maior_historia = new Chart(
            document.getElementById("votos_maior_historia"),
            {
                type: 'doughnut',
                data: {
                    labels: votosLutadores.lutadores,
                    datasets: [{
                        label: "Votos",
                        data: votosLutadores.votos,
                        backgroundColor: [
                            "#c90024",
                            "#ffffff",
                            "#777777",
                            "#8b0000",
                            "#444444",
                            "#d93636"
                        ]
                    }]
                }
            }
        );



        const votos_musica = new Chart(

                type: 'bar',

                    datasets: [{
                        label: "Votos",
                        data: votosMusicas.votos,
                        backgroundColor: ["#c90024",]
                    }]
                },
                options: {
                    indexAxis: 'y'
                },
            }
        );
    }
