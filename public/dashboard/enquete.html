<script>
    b_usuario.innerHTML = sessionStorage.APELIDO_USUARIO;

    function votar() {
        let opcoes = document.getElementsByName("lutador")
        let id_opcao = null

        for (let i = 0; i < opcoes.length; i++) {
            if (opcoes[i].checked) {
                id_opcao = opcoes[i].value;
            }
        }

        if (id_opcao == null) {
            alert("Selecione um lutador antes de votar!");
            return;
        } else {
            let id_usuario = sessionStorage.ID_USUARIO

            fetch("/voto/votar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    id_usuario: id_usuario,
                    id_opcao: id_opcao
                })
            })
                .then(function (resposta) {
                    console.log(resposta);
                    if (resposta.ok) {
                        console.log("Voto registrado!");
                        msg.innerHTML = 'voto registrado com sucesso!'
                    } else {
                        console.log("Erro ao registrar voto!");
                    }
                })
                .catch(function (erro) {
                    console.log("Erro na requisição:", erro);
                });

                
        }
    }
</script>
